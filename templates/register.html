{% extends "base.html" %}
{% block title %}สมัครสมาชิก — ร้านเสื้อผ้า{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">สมัครสมาชิก</h1>
        <p class="text-gray-500 text-center text-sm mb-8">สร้างบัญชีเพื่อสั่งซื้อสินค้า</p>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                <input type="email" name="email" required
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่าน</label>
                <input type="password" name="confirm_password" required
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-xl transition font-medium">
                สมัครสมาชิก
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            มีบัญชีแล้ว? <a href="{{ url_for('login') }}" class="text-brand-600 hover:text-brand-700 font-medium">เข้าสู่ระบบ</a>
        </p>
    </div>
</div>
{% endblock %}
